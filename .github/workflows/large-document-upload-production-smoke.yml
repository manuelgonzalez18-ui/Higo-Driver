name: Large Document Upload Production Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/large-document-upload-production-smoke.yml'

permissions:
  contents: read

jobs:
  large-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare multipart proxy and direct JSON transport
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/higo-large-upload
          mkdir -p "$work"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > "$work/template.png"
          for name in profile identity license registration rcv vehicle; do
            cp "$work/template.png" "$work/$name.png"
            head -c $((4 * 1024 * 1024 - 68)) /dev/zero >> "$work/$name.png"
          done
          token='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'

          proxy_status=$(curl --silent --show-error --max-time 240 \
            --output "$work/proxy-response.json" --write-out '%{http_code}' \
            --request POST 'https://higodriver.com/api/upload-documents.php' \
            --form-string "token=$token" \
            --form "profile_photo=@$work/profile.png;type=image/png" \
            --form "identity=@$work/identity.png;type=image/png" \
            --form "driver_license=@$work/license.png;type=image/png" \
            --form "vehicle_registration=@$work/registration.png;type=image/png" \
            --form "rcv=@$work/rcv.png;type=image/png" \
            --form "vehicle_photo=@$work/vehicle.png;type=image/png" || true)
          echo "Higo Driver multipart: HTTP $proxy_status"
          cat "$work/proxy-response.json" || true
          echo

          python3 - <<'PY'
          import base64, json, pathlib
          work = pathlib.Path('/tmp/higo-large-upload')
          mapping = {
              'profile_photo': 'profile.png',
              'identity': 'identity.png',
              'driver_license': 'license.png',
              'vehicle_registration': 'registration.png',
              'rcv': 'rcv.png',
              'vehicle_photo': 'vehicle.png',
          }
          files = {}
          for field, filename in mapping.items():
              raw = (work / filename).read_bytes()
              files[field] = {
                  'name': filename,
                  'mime': 'image/png',
                  'size': len(raw),
                  'data_base64': base64.b64encode(raw).decode('ascii'),
              }
          (work / 'payload.json').write_text(json.dumps({
              'token': 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA',
              'files': files,
          }), encoding='utf-8')
          PY

          direct_status=$(curl --silent --show-error --max-time 240 \
            --output "$work/direct-response.json" --write-out '%{http_code}' \
            --request POST 'https://higoapp.com/api/driver-application-documents.php' \
            --header 'Content-Type: application/json' \
            --data-binary "@$work/payload.json" || true)
          echo "Higo App direct JSON: HTTP $direct_status"
          cat "$work/direct-response.json" || true
          echo

          test "$direct_status" = '401'
          grep -q 'invalid_or_expired_token' "$work/direct-response.json"
