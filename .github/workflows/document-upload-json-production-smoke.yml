name: Document Upload JSON Production Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/document-upload-json-production-smoke.yml'
      - 'api/upload-documents.php'

permissions:
  contents: read

jobs:
  json-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Higo App accepts JSON files behind Node hosting
        shell: bash
        run: |
          set -euo pipefail
          # Retry after the production deployment of Higo App main.
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          size=$(printf '%s' "$png" | base64 -d | wc -c | tr -d ' ')
          token='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          payload=$(jq -n \
            --arg token "$token" \
            --arg png "$png" \
            --argjson size "$size" \
            '{token:$token,files:{
              profile_photo:{name:"profile.png",mime:"image/png",size:$size,data_base64:$png},
              identity:{name:"identity.png",mime:"image/png",size:$size,data_base64:$png},
              driver_license:{name:"license.png",mime:"image/png",size:$size,data_base64:$png},
              vehicle_registration:{name:"registration.png",mime:"image/png",size:$size,data_base64:$png},
              rcv:{name:"rcv.png",mime:"image/png",size:$size,data_base64:$png},
              vehicle_photo:{name:"vehicle.png",mime:"image/png",size:$size,data_base64:$png}
            }}')
          status=$(curl --silent --show-error \
            --output /tmp/response.json --write-out '%{http_code}' \
            --request POST 'https://higoapp.com/api/driver-application-documents.php' \
            --header 'Content-Type: application/json' \
            --data-binary "$payload")
          cat /tmp/response.json
          test "$status" = '401'
          grep -q 'invalid_or_expired_token' /tmp/response.json
